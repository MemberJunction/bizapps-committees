name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targetVersion:
        description: 'Target version (e.g., 5.27.2). Leave empty for auto-detection.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: "publish"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate pnpm-lock.yaml case-sensitivity
        run: ./.github/scripts/validate-package-lock-case.sh

      - name: Validate migration filenames
        run: ./.github/scripts/validate-migration-filenames.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all packages exist on npm
        if: github.ref == 'refs/heads/main'
        run: ./.github/scripts/validate-npm-packages.sh

      - name: Validate repository.url for npm provenance
        run: ./.github/scripts/validate-package-repository.sh

      - name: Configure git credentials
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Check for pending changesets
        id: changeset_check
        run: |
          PENDING=$(find .changeset -name "*.md" -not -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          if [ "$PENDING" -eq 0 ]; then
            echo "No pending changesets — nothing to publish"
          else
            echo "Found $PENDING pending changeset(s)"
          fi

      - name: Determine next expected version
        if: steps.changeset_check.outputs.pending != '0' && github.ref == 'refs/heads/main' && !github.event.inputs.targetVersion
        id: version_check
        run: |
          # Get current version from entities package (any of the 5 committees packages works since they're fixed-versioned)
          CURRENT_VERSION=$(jq -r .version packages/GeneratedEntities/package.json)
          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          NEXT_MAJOR_VERSION="$(( ${VERSION_PARTS[0]} + 1 )).0.0"
          NEXT_MINOR_VERSION="${VERSION_PARTS[0]}.$(( ${VERSION_PARTS[1]} + 1 )).0"
          NEXT_PATCH_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$(( ${VERSION_PARTS[2]} + 1 ))"

          # Check if any changeset requests a major bump
          HAS_MAJOR=false
          for f in .changeset/*.md; do
            [ "$f" = ".changeset/README.md" ] && continue
            [ ! -f "$f" ] && continue
            if grep -qE '^"@mj-biz-apps/.*":\s*major' "$f"; then
              HAS_MAJOR=true
              break
            fi
          done

          if [ "$HAS_MAJOR" = true ]; then
            echo "Major changeset found — bumping major version"
            echo "EXPECTED_NEXT_VERSION=$NEXT_MAJOR_VERSION" >> "$GITHUB_OUTPUT"
          else
            # Check for new migration files since last tag
            if git rev-parse "v${CURRENT_VERSION}" >/dev/null 2>&1; then
              NEW_MIGRATION_FILES=$(git --no-pager diff --name-only "v${CURRENT_VERSION}" "${{ github.sha }}" -- migrations/ migrations-pg/ || true)
            else
              NEW_MIGRATION_FILES=""
            fi

            if [ -n "$NEW_MIGRATION_FILES" ]; then
              echo "New migrations found — bumping minor version"
              echo "EXPECTED_NEXT_VERSION=$NEXT_MINOR_VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "No new migrations — bumping patch version"
              echo "EXPECTED_NEXT_VERSION=$NEXT_PATCH_VERSION" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update version
        if: steps.changeset_check.outputs.pending != '0'
        run: |
          EXPECTED_NEXT_VERSION="${{ github.event.inputs.targetVersion || steps.version_check.outputs.EXPECTED_NEXT_VERSION }}"
          echo "Expected next version: $EXPECTED_NEXT_VERSION"

          pnpm run version

          NEXT_VERSION=$(jq -r .version packages/GeneratedEntities/package.json)
          echo "Actual next version: $NEXT_VERSION"

          if [ -n "$EXPECTED_NEXT_VERSION" ] && [ "$NEXT_VERSION" != "$EXPECTED_NEXT_VERSION" ]; then
            echo "::error::Version mismatch! Expected $EXPECTED_NEXT_VERSION but got $NEXT_VERSION"
            exit 1
          fi

      - name: Sync mj-app.json version and MJ version range
        if: steps.changeset_check.outputs.pending != '0'
        run: |
          # Sync app version from a package (GeneratedEntities is the canonical version source for this repo)
          VERSION=$(jq -r .version packages/GeneratedEntities/package.json)
          jq --arg v "$VERSION" '.version = $v' mj-app.json > mj-app.json.tmp
          mv mj-app.json.tmp mj-app.json
          echo "Updated mj-app.json version to $VERSION"

          # Derive mjVersionRange from the @memberjunction/core dependency — but never LOWER
          # an existing floor. Migrations can require a newer core than the npm libraries do
          # (e.g. the SS Metadata_Sync migration calls spCreateAIAgent @SkillActivationMode,
          # a v5.45 core sproc, while the packages are happy on ^5.44.0), and mj-app.json is
          # where that host-platform floor is recorded by hand.
          MJ_DEP=$(jq -r '.dependencies["@memberjunction/core"] // .peerDependencies["@memberjunction/core"] // empty' packages/GeneratedEntities/package.json)
          if [ -n "$MJ_DEP" ]; then
            MJ_MIN=$(echo "$MJ_DEP" | sed 's/^[^0-9]*//')
            EXISTING_MIN=$(jq -r '.mjVersionRange // empty' mj-app.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if [ -n "$EXISTING_MIN" ] && [ "$(printf '%s\n%s\n' "$MJ_MIN" "$EXISTING_MIN" | sort -V | tail -1)" = "$EXISTING_MIN" ]; then
              MJ_MIN="$EXISTING_MIN"
            fi
            MJ_NEXT_MAJOR="$(( $(echo "$MJ_MIN" | cut -d. -f1) + 1 )).0.0"
            MJ_RANGE=">=${MJ_MIN} <${MJ_NEXT_MAJOR}"
            jq --arg r "$MJ_RANGE" '.mjVersionRange = $r' mj-app.json > mj-app.json.tmp
            mv mj-app.json.tmp mj-app.json
            echo "Updated mj-app.json mjVersionRange to $MJ_RANGE"
          fi

      - name: Sync mj-app.json upstream BizApps dependency version ranges
        if: steps.changeset_check.outputs.pending != '0'
        run: |
          # Derive each upstream range from the dependency a published package actually
          # uses. These used to read apps/MJAPI/package.json, which no longer exists —
          # the dev harness was removed, so the app's own packages are the only source.
          # Each upstream OpenApp version-locks its packages as a fixed changesets group,
          # so the -entities version is the same number the old -server pin gave.
          #
          # NOTE: array-form dependencies — select the entry by name, set its
          # `versionRange` field. Do NOT "simplify" this to object-form indexing
          # (.dependencies["name"]); that shape belongs to other repos' manifests and
          # against this one it silently matches nothing and still exits 0.
          #
          # The guards below are `-z` / exit 1 on purpose. The previous `-n` shape meant
          # a missing source made the step a no-op: the workflow stayed green while
          # mj-app.json's ranges quietly froze at whatever they last were.

          # BizApps Tasks — packages/Angular is the only package that depends on it
          TASKS_SRC=packages/Angular/package.json
          TASKS_DEP=$(jq -r '.dependencies["@mj-biz-apps/tasks-entities"] // .peerDependencies["@mj-biz-apps/tasks-entities"] // empty' "$TASKS_SRC")
          if [ -z "$TASKS_DEP" ]; then
            echo "::error::could not derive the bizapps-tasks range — $TASKS_SRC must declare @mj-biz-apps/tasks-entities"
            exit 1
          fi
          TASKS_MIN=$(echo "$TASKS_DEP" | sed 's/^[^0-9]*//')
          TASKS_NEXT_MAJOR="$(( $(echo "$TASKS_MIN" | cut -d. -f1) + 1 )).0.0"
          TASKS_RANGE=">=${TASKS_MIN} <${TASKS_NEXT_MAJOR}"
          jq --arg r "$TASKS_RANGE" '(.dependencies[] | select(.name == "mj-bizapps-tasks")).versionRange = $r' mj-app.json > mj-app.json.tmp
          mv mj-app.json.tmp mj-app.json
          echo "Updated mj-app.json BizAppsTasks version range to $TASKS_RANGE"

          # BizApps Common — packages/Core depends on it
          BAC_SRC=packages/Core/package.json
          BAC_DEP=$(jq -r '.dependencies["@mj-biz-apps/common-entities"] // .peerDependencies["@mj-biz-apps/common-entities"] // empty' "$BAC_SRC")
          if [ -z "$BAC_DEP" ]; then
            echo "::error::could not derive the bizapps-common range — $BAC_SRC must declare @mj-biz-apps/common-entities"
            exit 1
          fi
          BAC_MIN=$(echo "$BAC_DEP" | sed 's/^[^0-9]*//')
          BAC_NEXT_MAJOR="$(( $(echo "$BAC_MIN" | cut -d. -f1) + 1 )).0.0"
          BAC_RANGE=">=${BAC_MIN} <${BAC_NEXT_MAJOR}"
          jq --arg r "$BAC_RANGE" '(.dependencies[] | select(.name == "mj-bizapps-common")).versionRange = $r' mj-app.json > mj-app.json.tmp
          mv mj-app.json.tmp mj-app.json
          echo "Updated mj-app.json BizAppsCommon version range to $BAC_RANGE"

      - name: Build all packages
        run: pnpm run build:packages

      - name: Publish to npm
        if: steps.changeset_check.outputs.pending != '0'
        run: pnpm exec changeset publish

      - name: Get version and create tag
        if: steps.changeset_check.outputs.pending != '0'
        id: get_version
        run: |
          git pull
          VERSION="v$(jq -r .version packages/GeneratedEntities/package.json)"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "## Published $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: steps.changeset_check.outputs.pending != '0'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: pnpm run commitpush

      - name: Merge main into next and update lockfile
        if: steps.changeset_check.outputs.pending != '0'
        run: |
          git checkout next
          pnpm run mergemain:update-lock
