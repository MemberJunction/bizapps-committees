name: Repo checks

# Guards specific to this repo. They live here, not in build.yml or changes.yml, because those and
# the other release workflows are copied byte-for-byte from the reference repo (bizapps-issues) and
# must stay identical across the open apps. Before the release-pipeline port this step ran
# inside this repo's old changes.yml.
on:
  pull_request:
    branches: [next, main, 'lts/**']
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  repo-guards:
    name: 'repo: guards'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check every metadata folder is in directoryOrder
        run: ./.github/scripts/validate-metadata-directory-order.sh

      # Self-test the dependency-model guard here; full repo enforcement turns on once existing
      # host-provided `dependencies` entries move to `peerDependencies`.
      - name: Dependency model guard self-test
        run: node ./.github/scripts/check-dependency-model.mjs --self-test

      # The release-line model relies on `mj migrate` refusing an out-of-order migration. Through
      # `mj app install` / `upgrade` that check is always on, but the CLI path passes
      # mj.config.cjs `outOfOrder` straight to Skyway, and `true` switches it off. Keep it unset.
      - name: mj.config.cjs does not turn on out-of-order migrations
        run: |
          if grep -nE '^\s*[^/]*outOfOrder\s*:\s*true' mj.config.cjs; then
            echo "::error file=mj.config.cjs::outOfOrder: true lets 'mj migrate' apply a migration older than one the database already ran. Release lines depend on that refusal; remove the setting."
            exit 1
          fi
          echo "outOfOrder is not enabled"
