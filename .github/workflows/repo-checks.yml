name: Repo checks

# Guards specific to this repo. They live here, not in build.yml or changes.yml, because those and
# the other release workflows are copied byte-for-byte from the reference repo (bizapps-issues) and
# must stay identical across the open apps. Before the release-pipeline port this step ran
# inside this repo's old changes.yml.
on:
  pull_request:
    branches: [next, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  repo-guards:
    name: 'repo: guards'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check every metadata folder is in directoryOrder
        run: ./.github/scripts/validate-metadata-directory-order.sh
