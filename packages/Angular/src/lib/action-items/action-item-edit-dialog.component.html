<div class="dialog-backdrop" (click)="OnClose()"></div>
<div class="dialog-panel">
    <div class="dialog-header">
        <h2 class="dialog-title">{{ DialogTitle }}</h2>
        <button class="dialog-close" (click)="OnClose()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    @if (IsLoading) {
        <div class="dialog-loading">
            <mj-loading text="Loading..."></mj-loading>
        </div>
    } @else if (ActionItem) {
        <div class="dialog-body">
            @if (ErrorMessage) {
                <div class="error-banner">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    {{ ErrorMessage }}
                </div>
            }

            <!-- Title -->
            <div class="form-group">
                <label class="form-label required">Name</label>
                <input type="text" class="form-input"
                    [(ngModel)]="ActionItem.Name"
                    placeholder="What needs to be done?">
            </div>

            <!-- Description -->
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-input form-textarea"
                    [(ngModel)]="ActionItem.Description"
                    placeholder="Additional details..."
                    rows="3"></textarea>
            </div>

            <!-- Committee & Meeting row -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label required">Committee</label>
                    <select class="form-input" [(ngModel)]="ActionItem.CommitteeID">
                        <option [ngValue]="null" disabled>Select committee...</option>
                        @for (c of Committees; track c.ID) {
                            <option [ngValue]="c.ID">{{ c.Name }}</option>
                        }
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Meeting</label>
                    <select class="form-input" [(ngModel)]="ActionItem.MeetingID">
                        <option [ngValue]="null">None</option>
                        @for (m of Meetings; track m.ID) {
                            <option [ngValue]="m.ID">{{ m.Name }}</option>
                        }
                    </select>
                </div>
            </div>

            <!-- Assigned To -->
            <div class="form-group">
                <label class="form-label required">Assigned To</label>
                <select class="form-input" [(ngModel)]="ActionItem.AssignedToPersonID">
                    <option [ngValue]="null" disabled>Select person...</option>
                    @for (p of AllPeople; track p.ID) {
                        <option [ngValue]="p.ID">{{ p.DisplayName }}</option>
                    }
                </select>
            </div>

            <!-- Due Date, Priority, Status row -->
            <div class="form-row form-row-3">
                <div class="form-group">
                    <label class="form-label">Due Date</label>
                    <input type="date" class="form-input" [(ngModel)]="DueDateLocal">
                </div>
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select class="form-input" [(ngModel)]="ActionItem.Priority">
                        @for (p of PriorityOptions; track p) {
                            <option [ngValue]="p">{{ p }}</option>
                        }
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select class="form-input" [(ngModel)]="ActionItem.Status">
                        @for (s of StatusOptions; track s) {
                            <option [ngValue]="s">{{ s }}</option>
                        }
                    </select>
                </div>
            </div>

            <!-- Completion Notes (shown when Completed) -->
            @if (ActionItem.Status === 'Completed') {
                <div class="form-group">
                    <label class="form-label">Completion Notes</label>
                    <textarea class="form-input form-textarea"
                        [(ngModel)]="ActionItem.CompletionNotes"
                        placeholder="Notes about how this was resolved..."
                        rows="2"></textarea>
                </div>
            }

        </div>

        <div class="dialog-footer">
            <div class="footer-left">
                <button class="btn btn-primary" (click)="OnSave()" [disabled]="IsSaving">
                    @if (IsSaving) {
                        <i class="fa-solid fa-spinner fa-spin"></i> Saving...
                    } @else {
                        <i class="fa-solid fa-check"></i> Save
                    }
                </button>
                <button class="btn btn-secondary" (click)="OnClose()" [disabled]="IsSaving">
                    Cancel
                </button>
            </div>
            @if (!IsNew && ActionItem.Status !== 'Cancelled') {
                <div class="footer-right">
                    @if (!ShowCancelConfirm) {
                        <button class="btn btn-danger-outline" (click)="ShowCancelConfirm = true">
                            <i class="fa-solid fa-ban"></i> Cancel Item
                        </button>
                    } @else {
                        <span class="confirm-text">Are you sure?</span>
                        <button class="btn btn-danger" (click)="OnCancelItem()" [disabled]="IsSaving">
                            Yes, Cancel It
                        </button>
                        <button class="btn btn-secondary" (click)="ShowCancelConfirm = false">
                            No
                        </button>
                    }
                </div>
            }
        </div>
    }
</div>
