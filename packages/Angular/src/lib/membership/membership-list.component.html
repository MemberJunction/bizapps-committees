@if (IsLoading) {
    <div class="list-loading">
        <mj-loading text="Loading..."></mj-loading>
    </div>
} @else {
    <div class="membership-list-container">
        @if (Committees.length === 0) {
            <div class="page-header">
                <h1 class="page-title">Members</h1>
            </div>
            <div class="empty-state">
                <i class="fa-solid fa-users-slash"></i>
                <p>You are not a member of any committees.</p>
            </div>
        } @else {
            <!-- Page Header: Title + Committee Selector left, nothing right (Add Member is in panel) -->
            <div class="page-header">
                <div class="header-left">
                    <h1 class="page-title">Members</h1>
                    @if (Committees.length > 1) {
                        <select class="committee-select"
                            [ngModel]="SelectedCommitteeID"
                            (ngModelChange)="OnCommitteeChanged($event)">
                            @for (committee of Committees; track committee.ID) {
                                <option [ngValue]="committee.ID">{{ committee.Name }}</option>
                            }
                        </select>
                    } @else if (Committees.length === 1) {
                        <span class="single-committee-name">{{ Committees[0].Name }}</span>
                    }
                </div>
            </div>

            @if (SelectedCommitteeID) {
                <committees-membership-panel
                    [CommitteeID]="SelectedCommitteeID">
                </committees-membership-panel>
            }
        }
    </div>
}
